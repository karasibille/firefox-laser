name: CI

on:
  push:
  pull_request:

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint (addons-linter, as on addons.mozilla.org)
        run: npx --yes web-ext@10.7.0 lint --warnings-as-errors

      - name: Build
        run: npx --yes web-ext@10.7.0 build --overwrite-dest

      - uses: actions/upload-artifact@v4
        with:
          name: laser-xpi
          path: web-ext-artifacts/*.zip
